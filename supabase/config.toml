project_id = "halve"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "halve://"
additional_redirect_urls = ["halve://auth-callback", "https://halve.golf"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Phone OTP costs real money per SMS — keep Apple and Google above it in the UI.
[auth.sms]
enable_signup = true
enable_confirmations = true

# Native Sign in with Apple verifies the identity token against the app's bundle
# identifier, so client_id is the bundle id and no secret is needed — that is
# only required for the web OAuth flow, which this app does not use.
#
# This must stay in sync with the dashboard: `supabase config push` overwrites
# remote auth settings, so leaving it false here would silently disable a
# provider someone enabled by hand.
[auth.external.apple]
enabled = true
client_id = "golf.halve.app"

# Google is off until OAuth credentials exist — enabling a provider with empty
# secrets breaks the auth service rather than degrading.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[edge_runtime]
enabled = true
policy = "oneshot"

# Called by pg_cron through pg_net, which has no user session to present. It
# authenticates with the PUSH_DISPATCH_SECRET shared secret instead — see
# supabase/migrations/0011_push_dispatch.sql. Declared here rather than passed
# as --no-verify-jwt so a later deploy cannot quietly re-enable the check and
# stop every notification with a 401.
[functions.push-dispatch]
verify_jwt = false

[analytics]
enabled = false
