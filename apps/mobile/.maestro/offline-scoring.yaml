# E2E flow 2 (Technical Spec §10): offline scoring survives a force-quit.
#
# Scope, stated honestly: Maestro's setAirplaneMode is Android-only, so this
# flow cannot cut the radio on an iOS simulator. What it does cover on both
# platforms is the other half of the offline guarantee — that scores are
# written locally first and survive the process dying mid-round.
#
# The radio-off leg lives in offline-scoring.android.yaml.
# The four-device staggered-reconnect test from the build plan is still manual;
# no single-device harness can express it.
appId: golf.halve.app
---
- launchApp

# A debug build has to bundle before anything renders; launchApp returns
# well before that, so every cold start needs an explicit wait.
- extendedWaitUntil:
    visible: 'Crews'
    timeout: 90000

- tapOn: 'Rounds, tab.*'
- tapOn:
    text: '.*Copperhead.*'
    index: 0
- tapOn:
    text: '.*Open the card.*|.*Start the round.*'

# Score five holes.
- repeat:
    times: 5
    commands:
      - tapOn:
          id: 'score-par'
          index: 0
      - tapOn: 'Next ▶'

# Kill the app mid-round. Nothing may be lost: the scorecard writes to MMKV
# before it writes to the network.
- stopApp
- launchApp

# A debug build has to bundle before anything renders; launchApp returns
# well before that, so every cold start needs an explicit wait.
- extendedWaitUntil:
    visible: 'Crews'
    timeout: 90000

- tapOn: 'Rounds, tab.*'
- tapOn:
    text: '.*Copperhead.*'
    index: 0
- tapOn:
    text: '.*Open the card.*|.*Start the round.*'
- tapOn: '.*Full card.*'

# The five scores are still on the card after the process was killed.
- assertVisible: '.*Hole.*'
- assertVisible:
    text: '.*Par.*'

- back
- extendedWaitUntil:
    visible: 'All scores synced'
    timeout: 30000
