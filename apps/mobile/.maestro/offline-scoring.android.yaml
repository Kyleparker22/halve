# E2E flow 2b: scoring with the radio off, then reconnecting.
#
# Android only — setAirplaneMode is not supported on iOS simulators, which is
# why this is a separate file rather than a branch inside the shared flow.
# Run it with an Android emulator attached:
#
#   maestro test .maestro/offline-scoring.android.yaml
appId: golf.halve.app
---
- launchApp
- extendedWaitUntil:
    visible: 'Crews'
    timeout: 90000

- tapOn: 'Rounds, tab.*'
- tapOn:
    text: '.*Copperhead.*'
    index: 0
- tapOn:
    text: '.*Open the card.*|.*Start the round.*'

# Radio off. Everything from here is local; the banner is reassurance, never a
# blocking modal.
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible: '.*Offline — scores saved.*'
    timeout: 15000

- repeat:
    times: 10
    commands:
      - tapOn:
          id: 'score-par'
          index: 0
      - tapOn: 'Next ▶'

# Entries queue rather than fail.
- assertVisible:
    text: '.*waiting to sync.*'

# Force-quit while still offline.
- stopApp
- launchApp
- tapOn: 'Rounds, tab.*'
- tapOn:
    text: '.*Copperhead.*'
    index: 0
- tapOn:
    text: '.*Open the card.*|.*Start the round.*'
- assertVisible:
    text: '.*waiting to sync.*'

# Reconnect and let the outbox drain.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: '.*All scores synced.*'
    timeout: 60000
