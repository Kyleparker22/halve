# E2E flow 1 (Technical Spec §10): invite → crew → round → score 18 → settle.
#
#   supabase db reset          # REQUIRED: the flow completes and settles a
#                              # seeded round, so it is not idempotent
#   pnpm --filter @halve/mobile e2e
#
# Needs a debug build installed — the dev sign-in is behind __DEV__.
#
# Selector notes, learned the hard way:
#   - Maestro anchors its text regex to the whole string, and iOS merges a
#     card's Text nodes into one accessibility label. Anything inside a card
#     needs .*wildcards.*
#   - Tab bar items expose no `text`, only accessibilityText of the form
#     "Rounds, tab, 2 of 4".
#   - A debug build bundles before it renders, so every cold start needs a wait.
appId: golf.halve.app
---
- launchApp:
    clearState: true

# clearState does not sign the user out: the Supabase session lives in the iOS
# Keychain, which survives an app data wipe. So sign-in is conditional on
# actually landing on the sign-in screen.
- extendedWaitUntil:
    visible: '.*Kaddee.*'
    timeout: 120000

- runFlow:
    when:
      visible: '.*Development sign-in.*'
    commands:
      # The keyboard covers the lower half of the screen: without dismissing
      # it, a tap aimed at the next field lands on a key instead.
      - tapOn:
          id: 'dev-email'
      - inputText: 'maestro@example.com'
      # hideKeyboard is unsupported here; the screens use
      # keyboardShouldPersistTaps="handled", so tapping static text dismisses it.
      - tapOn: '.*Never shipped.*'
      - tapOn:
          id: 'dev-password'
      - inputText: 'maestro-e2e-password'
      - tapOn: '.*Never shipped.*'
      - tapOn: 'Sign in \(dev\)'
      # A first run creates the account and lands on onboarding.
      - runFlow:
          when:
            visible: '.*Set up your profile.*'
          commands:
            - tapOn: 'Start playing'

# iOS offers to save the password after a successful sign-in.
- runFlow:
    when:
      visible: 'Save Password\?'
    commands:
      - tapOn: 'Not Now'

- extendedWaitUntil:
    visible: 'Crews'
    timeout: 60000

# The invite path: join the seeded crew by its code. A crew of one has no
# counterparty, so creating a fresh crew would leave nothing to settle.
- tapOn: 'New crew'
- tapOn:
    id: 'join-code'
- inputText: 'sat4some01'
- tapOn: '.*Or join with a code.*'
- tapOn: 'Join'
- extendedWaitUntil:
    visible: '.*Invite to the crew.*'
    timeout: 30000
- assertVisible: '.*Your balance.*'

# Joining replaces the route with the crew screen, pushed over the tabs. The
# tab bar is unreachable until it is popped, and Maestro's `back` does not pop
# this native stack — tap the header back button instead.
- tapOn: 'Back'

# The seeded upcoming round already has two players in it.
- tapOn: 'Rounds, tab.*'
- extendedWaitUntil:
    visible: 'Schedule'
    timeout: 30000
- tapOn:
    text: '.*Copperhead.*'
    index: 0
- extendedWaitUntil:
    visible: 'Roster'
    timeout: 30000

# A Nassau over the two who are in.
- tapOn: 'Add'
- extendedWaitUntil:
    visible: '.*Add a game.*'
    timeout: 30000
- tapOn: 'Nassau'
- tapOn: 'Add game'
- extendedWaitUntil:
    visible: '.*Nassau.*'
    timeout: 30000

- tapOn: 'Start the round'
- extendedWaitUntil:
    visible: '.*Hole 1.*'
    timeout: 30000

# Hole 1: par for the first player, a bogey for the second, so the Nassau has
# a winner. All-square would settle to nothing and prove less.
- tapOn:
    id: 'score-par'
    index: 0
- tapOn:
    text: 'increase'
    index: 1
- tapOn: 'Next ▶'

# Holes 2–17 at par for both.
- repeat:
    times: 16
    commands:
      - tapOn:
          id: 'score-par'
          index: 0
      - tapOn:
          id: 'score-par'
          index: 1
      - tapOn: 'Next ▶'

# Hole 18 has a Finish button rather than Next.
- tapOn:
    id: 'score-par'
    index: 0
- tapOn:
    id: 'score-par'
    index: 1
- tapOn: 'Finish'

- extendedWaitUntil:
    visible: 'Leaderboard'
    timeout: 30000
- tapOn: 'Finish and settle'
- extendedWaitUntil:
    visible: '.*This round is settled.*'
    timeout: 60000

- tapOn: 'Open the crew ledger'
- extendedWaitUntil:
    visible: '.*Where everyone stands.*'
    timeout: 30000
- tapOn: '.*Settle in.*'
- extendedWaitUntil:
    visible: '.*The smallest set of payments.*'
    timeout: 30000
- tapOn: 'Request these payments'
- extendedWaitUntil:
    visible: '.*Waiting on.*'
    timeout: 30000
